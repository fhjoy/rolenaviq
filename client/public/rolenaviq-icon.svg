<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">RoleNaviq</title>
  <desc id="desc">A briefcase combined with a compass arrow, representing career navigation.</desc>

  <defs>
    <style>
      .teal-stroke { stroke: #0f766e; }
      .teal-fill { fill: #0f766e; }
      .ink-stroke { stroke: #1f2937; }

      @media (prefers-color-scheme: dark) {
        .teal-stroke { stroke: #2dd4bf; }
        .teal-fill { fill: #2dd4bf; }
        .ink-stroke { stroke: #f8fafc; }
      }
    </style>
  </defs>

  <!-- Briefcase: job / career -->
  <rect
    x="10"
    y="20"
    width="44"
    height="32"
    rx="7"
    fill="none"
    class="teal-stroke"
    stroke-width="3.5"
  />
  <path
    d="M23 20v-3.5A4.5 4.5 0 0 1 27.5 12h9A4.5 4.5 0 0 1 41 16.5V20"
    fill="none"
    class="teal-stroke"
    stroke-width="3.5"
    stroke-linecap="round"
  />

  <!-- Compass ring: navigation -->
  <circle
    cx="32"
    cy="36"
    r="13"
    fill="#ffffff"
    fill-opacity=".96"
    class="teal-stroke"
    stroke-width="3"
  />

  <!-- Cardinal ticks -->
  <path
    d="M32 20.5v3M32 48.5v3M16.5 36h3M44.5 36h3"
    class="teal-stroke"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Navigation needle -->
  <path
    d="M26.7 41.3 31 31l10.3-4.3L37 37l-10.3 4.3Z"
    class="teal-fill ink-stroke"
    stroke-width="1.8"
    stroke-linejoin="round"
  />
  <path
    d="M31 31 37 37l-10.3 4.3L31 31Z"
    fill="#ffffff"
    class="ink-stroke"
    stroke-width="1.8"
    stroke-linejoin="round"
  />

  <!-- Center point -->
  <circle cx="32" cy="36" r="1.8" fill="#1f2937" />
</svg>
