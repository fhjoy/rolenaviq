name: RoleNaviq CI

on:
  push:
    branches: [main, devops/docker]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    env:
      CYPRESS_INSTALL_BINARY: "0"
      VITE_API_URL: /api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: Cypress browser tests
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix server
      - name: Run Cypress
        uses: cypress-io/github-action@v7.4.4
        with:
          working-directory: client
          install-command: npm ci
          start: |
            npm --prefix ../server run e2e:start
            npm run dev:e2e
          wait-on: http://127.0.0.1:5001/api/health, http://127.0.0.1:4173
          wait-on-timeout: 120
          browser: chrome
      - name: Save failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: client/cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker stack smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: rolenaviq-ci
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start healthy containers
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Check frontend and API through Nginx
        run: |
          curl --fail --silent --show-error http://localhost:8080/ > /tmp/rolenaviq-index.html
          grep -q '<div id="root"></div>' /tmp/rolenaviq-index.html
          curl --fail --silent --show-error http://localhost:8080/api/health | jq -e '.status == "ok" and .service == "RoleNaviq API"'
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Remove CI containers and temporary database
        if: always()
        run: docker compose down --volumes --remove-orphans
